<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Casa en Orden">
  <meta name="description" content="Organiza tus compras, alimentos, aseo y servicios del hogar.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Casa en Orden</title>
  <style>
    :root{--bg:#faf9f5;--paper:#fff;--ink:#20302e;--muted:#76847e;--green:#336f5d;--green2:#e5f2ec;--line:#e9ede6;--rose:#c26056;--rose2:#fff0ec;--amber:#ad7b31;--amber2:#fff7e5;--shadow:0 11px 36px rgba(32,48,46,.055)}
    *{box-sizing:border-box}html{height:100%}body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #87bf9d;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}
    .app{max-width:680px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 23px) 19px calc(env(safe-area-inset-bottom) + 108px)}
    .mast{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:27px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.035em;font-size:19px}.brandmark{height:41px;width:41px;display:grid;place-items:center;border-radius:14px;background:var(--green);color:#fff;font-size:21px;box-shadow:0 5px 12px #336f5d29}.icon-button{width:43px;height:43px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--green);font-size:20px;display:grid;place-items:center}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:750;color:var(--green)}h1{font-size:31px;font-weight:800;letter-spacing:-.06em;line-height:1.13;margin:7px 0 10px}h2{font-size:20px;letter-spacing:-.04em;margin:0}p{margin:0}.intro{font-size:14px;color:var(--muted);line-height:1.5}.headline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 15px}.section{margin-top:26px}.counter{font-size:12px;border-radius:99px;color:var(--green);background:var(--green2);padding:5px 9px;font-weight:750;white-space:nowrap}
    .hero{background:linear-gradient(128deg,#2e6957,#447f6b);color:white;border-radius:25px;padding:23px 21px 22px;box-shadow:var(--shadow);margin-top:22px;position:relative;overflow:hidden}.hero:after{content:"✦";color:#ffffff22;font-size:125px;position:absolute;right:-8px;top:-42px}.hero small{font-size:12px;color:#cce7d8;letter-spacing:.02em;font-weight:650}.hero .big{font-size:23px;font-weight:750;letter-spacing:-.045em;margin:9px 0;max-width:260px}.hero .sub{font-size:13px;color:#def0e4;max-width:290px;line-height:1.45}.hero .action{background:white;color:#306a58;border:0;border-radius:11px;padding:10px 13px;margin-top:15px;font-size:13px;font-weight:760}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:17px}.stat{background:var(--paper);padding:17px;border:1px solid var(--line);border-radius:20px;text-align:left;box-shadow:var(--shadow)}.stat .symbol{height:35px;width:35px;border-radius:11px;display:grid;place-items:center;background:var(--green2);font-size:17px}.stat.warm .symbol{background:var(--amber2)}.stat.pink .symbol{background:var(--rose2)}.stat.purple .symbol{background:#efebf8}.stat strong{display:block;font-size:27px;letter-spacing:-.06em;margin:12px 0 3px}.stat span:last-child{display:block;font-size:12px;color:var(--muted);font-weight:600}
    .list{display:grid;gap:10px}.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;align-items:center;gap:12px;min-height:77px}.avatar{flex-shrink:0;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#eaf4ed;font-size:19px}.avatar.rose{background:var(--rose2)}.avatar.amber{background:var(--amber2)}.avatar.purple{background:#efebf8}.itembody{flex:1;min-width:0}.itemtitle{font-size:14px;font-weight:740;line-height:1.3;overflow-wrap:anywhere}.itemmeta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.right{display:flex;gap:7px;align-items:center;flex-shrink:0}.mini{border:0;border-radius:11px;background:#e8f3ed;padding:9px 10px;color:var(--green);font-size:12px;font-weight:750;white-space:nowrap}.mini.light{background:#f3f5f2;color:#53625a}.mini.danger{background:var(--rose2);color:var(--rose);padding:9px 11px}.pill{font-size:11px;padding:5px 8px;border-radius:9px;font-weight:750;display:inline-block;background:var(--green2);color:var(--green)}.pill.warn{background:var(--amber2);color:var(--amber)}.pill.urgent{background:var(--rose2);color:var(--rose)}
    .empty{text-align:center;padding:32px 22px;border:1px dashed #d9e5db;border-radius:20px;background:#fff9}.empty .emptyicon{font-size:36px;display:block;margin-bottom:9px}.empty strong{font-size:14px;display:block}.empty p{font-size:13px;color:var(--muted);margin:7px auto 15px;max-width:260px;line-height:1.5}.primary{border:0;color:#fff;background:var(--green);border-radius:13px;padding:12px 15px;font-size:13px;font-weight:760}.outline{border:1px solid #c7dcd0;color:var(--green);background:#fff;border-radius:12px;padding:10px 13px;font-weight:740;font-size:13px}.full{width:100%}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:19px 0 15px}.toolbar h1{margin:0}.tabs{background:#ecf0ea;border-radius:15px;padding:4px;display:flex;gap:4px;margin:20px 0}.tabs button{border:0;flex:1;background:transparent;border-radius:11px;padding:11px 5px;font-size:13px;font-weight:700;color:#708077}.tabs button.selected{background:#fff;box-shadow:0 2px 8px #263a3010;color:var(--green)}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:3px 0 14px}.check{width:23px;height:23px;accent-color:var(--green);cursor:pointer}.done .itemtitle{text-decoration:line-through;color:#81918a}.group-head{color:#78867b;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin:20px 2px 9px}.total{font-size:14px;font-weight:700;background:#edf3ea;padding:12px 14px;border-radius:13px;margin:14px 0}
    nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fffc;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:11px max(13px,calc((100vw - 680px) / 2 + 16px)) calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-around;gap:6px}nav button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;flex:1;border:0;background:transparent;border-radius:14px;padding:6px 1px;color:#8c9990;font-size:10px;font-weight:690}nav button .navicon{font-size:22px;line-height:1.1}nav button.active{background:var(--green2);color:var(--green)}
    .overlay{position:fixed;inset:0;z-index:40;background:rgba(17,32,28,.40);display:flex;align-items:end;justify-content:center;padding:0}.sheet{width:100%;max-width:680px;max-height:92dvh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:23px 22px calc(env(safe-area-inset-bottom) + 25px);box-shadow:0 -10px 50px #14271b16}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:19px}.sheet-head h2{font-size:22px}.close{font-size:20px;border:0;background:#f1f4ef;color:#50675a;height:35px;width:35px;border-radius:11px}.field{margin-bottom:16px}.field label{font-size:12px;color:#52635b;font-weight:760;display:block;margin:0 0 7px}.field input,.field select{display:block;width:100%;min-height:47px;border:1px solid #dce7db;background:#fbfcfa;color:var(--ink);font-size:16px;border-radius:12px;padding:10px 12px}.field input::placeholder{color:#a1aca5}.form-actions{display:flex;gap:9px;margin-top:22px}.form-actions button{flex:1}.notice{background:var(--amber2);border-radius:15px;padding:13px;font-size:12px;line-height:1.55;color:#826129}.setting-card{border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.setting-card p{font-size:12px;color:var(--muted);line-height:1.55;margin:6px 0 13px}.alert{background:#fff;border:1px solid var(--line);display:flex;gap:12px;padding:13px 15px;border-radius:15px;align-items:start;margin:9px 0}.alert .emoji{font-size:19px}.alert strong{font-size:13px;display:block}.alert small{font-size:12px;display:block;color:var(--muted);margin-top:4px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:70;min-width:200px;max-width:90vw;text-align:center;background:#213b2e;color:white;padding:12px 17px;border-radius:13px;font-size:13px;font-weight:650;box-shadow:0 8px 18px #213b2e30}.top-note{margin:14px 0 0;border-radius:13px;background:#fff3dd;color:#85621c;padding:12px 14px;line-height:1.5;font-size:12px}.taskdate{font-size:12px;color:#5a7566;margin:12px 2px 14px}.hidden{display:none!important}@media (max-width:370px){.app{padding-inline:14px}.stat{padding:13px}.item{padding:11px}.right{gap:3px}.mini{padding:8px}}
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <nav aria-label="Navegación principal" id="bottomNav">
    <button type="button" data-nav="inicio"><span class="navicon">⌂</span><span>Inicio</span></button>
    <button type="button" data-nav="mercado"><span class="navicon">🛒</span><span>Mercado</span></button>
    <button type="button" data-nav="aseo"><span class="navicon">🧹</span><span>Aseo</span></button>
    <button type="button" data-nav="pagos"><span class="navicon">▤</span><span>Pagos</span></button>
  </nav>
  <div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden" aria-label="Importar respaldo">
<script>
(()=>{
'use strict';
const KEY='casa-en-orden-v1';
const defaults=()=>({version:1,shopping:[],pantry:[],chores:[],bills:[]});
let data;
try{const stored=JSON.parse(localStorage.getItem(KEY));data=validate(stored)?stored:defaults()}catch{data=defaults()}
let page='inicio',marketPage='compras',editing=null,transferId=null,toastTimer=null;
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const month=()=>today().slice(0,7);
const dateObj=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const daysUntil=s=>Math.round((dateObj(s)-dateObj(today()))/86400000);
const dateText=s=>{if(!s)return 'Sin fecha';try{return dateObj(s).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})}catch{return s}};
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function validate(o){return !!o&&typeof o==='object'&&['shopping','pantry','chores','bills'].every(k=>Array.isArray(o[k])&&o[k].length<10000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{showToast('No se pudo guardar; exporta una copia')}}
function showToast(s){clearTimeout(toastTimer);$('#toastRoot').innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;toastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function footer(){document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===page);b.setAttribute('aria-current',b.dataset.nav===page?'page':'false')})}
const header=()=>`<header class="mast"><div class="brand"><div class="brandmark">⌂</div><span>Casa en Orden</span></div><button type="button" class="icon-button" data-action="settings" aria-label="Copias de seguridad y ajustes">⚙</button></header>`;
function toPage(p){page=p;render();scrollTo({top:0,behavior:'smooth'})}
function billDue(b){const dt=new Date();const year=dt.getFullYear(),mo=dt.getMonth();return `${year}-${pad(mo+1)}-${pad(Math.min(Number(b.day)||1,new Date(year,mo+1,0).getDate()))}`}
function billsInfo(b){const due=billDue(b);return{due,days:daysUntil(due),paid:b.paidMonth===month()}}
function choreDue(c){const now=new Date();const dow=now.getDay();const done=c.lastDone===today();return {done,due:c.freq==='daily'||Number(c.day)===dow}}
function expiry(p){if(!p.expires)return null;return daysUntil(p.expires)}
function summary(){const shopping=data.shopping.filter(x=>!x.checked).length;const expiring=data.pantry.filter(x=>expiry(x)!==null&&expiry(x)<=7).length;const cleaning=data.chores.filter(x=>{let s=choreDue(x);return s.due&&!s.done}).length;const bills=data.bills.filter(x=>{let s=billsInfo(x);return !s.paid&&s.days<=7}).length;return{shopping,expiring,cleaning,bills}}
function alerts(){let a=[];for(const x of data.pantry){const d=expiry(x);if(d!==null&&d<=7)a.push({icon:'🥑',title:x.name,desc:d<0?`Venció hace ${-d} día(s)`:d===0?'Vence hoy':`Vence en ${d} día(s)`,rank:d<=1?0:1})}
for(const x of data.chores){let s=choreDue(x);if(s.due&&!s.done)a.push({icon:'🧹',title:x.title,desc:`Aseo pendiente · ${x.zone}`,rank:2})}
for(const x of data.bills){let s=billsInfo(x);if(!s.paid&&s.days<=7)a.push({icon:'🧾',title:x.name,desc:s.days<0?`Pago vencido hace ${-s.days} día(s)`:s.days===0?'Vence hoy':`Vence en ${s.days} día(s)`,rank:s.days<=1?0:1})}
return a.sort((x,y)=>x.rank-y.rank)}
function empty(icon,title,msg,action,label){return `<div class="empty"><span class="emptyicon">${icon}</span><strong>${title}</strong><p>${msg}</p>${action?`<button class="outline" data-action="${action}">${label}</button>`:''}</div>`}
function stat(icon,n,label,target,variant=''){return `<button class="stat ${variant}" data-nav="${target}"><span class="symbol">${icon}</span><strong>${n}</strong><span>${label}</span></button>`}
function home(){let s=summary(),a=alerts();const friendlyDate=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});return `${header()}<div class="eyebrow">${esc(friendlyDate)}</div><h1>Tu hogar, todo en orden.</h1><p class="intro">Tu espacio para organizar los pendientes de casa sin complicaciones.</p><section class="hero"><small>✦ RESUMEN DEL DÍA</small><div class="big">${a.length?`Tienes ${a.length} aviso${a.length===1?'':'s'} para revisar`:'¡Todo bajo control por ahora!'}</div><div class="sub">${a.length?'Revisa los pendientes y mantén tu hogar al día.':'Registra tus compras, tareas y servicios para empezar.'}</div><button class="action" data-action="quick-add">＋ Añadir pendiente</button></section><div class="stat-grid">${stat('🛒',s.shopping,'Por comprar','mercado')}${stat('🥑',s.expiring,'Vencimientos','mercado','warm')}${stat('🧹',s.cleaning,'Aseo para hoy','aseo','purple')}${stat('🧾',s.bills,'Pagos por atender','pagos','pink')}</div><section class="section"><div class="headline"><h2>Lo importante</h2><span class="counter">${a.length} avisos</span></div>${a.length?`<div class="list">${a.slice(0,8).map(x=>`<div class="alert"><span class="emoji">${x.icon}</span><div><strong>${esc(x.title)}</strong><small>${esc(x.desc)}</small></div></div>`).join('')}</div>`:empty('🌿','Nada urgente','Cuando agregues productos, tareas o servicios, tus recordatorios aparecerán aquí.',null,'')}</section><div class="top-note">🔒 Tus datos se guardan en este dispositivo. Para evitar perderlos, haz copias desde ⚙ Ajustes.</div>`}
function listRow(icon,title,desc,buttons,classes=''){return `<div class="item ${classes}"><div class="avatar">${icon}</div><div class="itembody"><div class="itemtitle">${esc(title)}</div><div class="itemmeta">${esc(desc)}</div></div><div class="right">${buttons}</div></div>`}
const btn=(act,id,title,cls='mini')=>`<button class="${cls}" data-action="${act}" data-id="${esc(id)}" aria-label="${esc(title)}">${esc(title)}</button>`;
function market(){const shopping=marketPage==='compras';return `${header()}<div class="toolbar"><div><div class="eyebrow">Control del hogar</div><h1>Mercado</h1></div><button class="primary" data-action="${shopping?'add-shopping':'add-pantry'}">＋ Agregar</button></div><p class="intro">Tu lista de compras y los productos que ya tienes en casa.</p><div class="tabs"><button data-market="compras" class="${shopping?'selected':''}">🛒 Por comprar</button><button data-market="despensa" class="${!shopping?'selected':''}">🥑 Despensa</button></div>${shopping?shoppingView():pantryView()}`}
function shoppingView(){const pending=data.shopping.filter(x=>!x.checked),done=data.shopping.filter(x=>x.checked);const row=x=>`<div class="item ${x.checked?'done':''}"><input class="check" type="checkbox" data-check="${esc(x.id)}" ${x.checked?'checked':''} aria-label="Comprado ${esc(x.name)}"><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemmeta">Cantidad: ${esc(x.qty||'1')}</div></div><div class="right">${x.checked?btn('transfer',x.id,'Guardar','mini'):btn('edit-shopping',x.id,'Editar','mini light')}${btn('delete-shopping',x.id,'×','mini danger')}</div></div>`;return `<p class="hint">Marca un artículo comprado y toca “Guardar” si quieres pasarlo a tu despensa.</p><div class="headline"><h2>Lista de compras</h2><span class="counter">${pending.length} pendientes</span></div>${data.shopping.length?`<div class="list">${pending.map(row).join('')}${done.map(row).join('')}</div>`:empty('🛒','Lista vacía','Agrega lo que necesitas comprar en tu próximo mercado.','add-shopping','Añadir producto')}`}
function pantryView(){let arr=[...data.pantry].sort((a,b)=>(!a.expires)-( !b.expires)||(a.expires||'').localeCompare(b.expires||''));const row=x=>{let d=expiry(x),msg=d===null?'Sin vencimiento':d<0?`Venció hace ${-d} día(s)`:d===0?'Vence hoy':d<=7?`Vence en ${d} día(s)`:`Vence ${dateText(x.expires)}`;return `<div class="item"><div class="avatar amber">🥫</div><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemmeta">${esc(x.qty||'1')} · ${esc(x.place||'Casa')}</div><div style="margin-top:6px"><span class="pill ${d!==null&&d<=1?'urgent':d!==null&&d<=7?'warn':''}">${esc(msg)}</span></div></div><div class="right">${btn('edit-pantry',x.id,'Editar','mini light')}${btn('delete-pantry',x.id,'×','mini danger')}</div></div>`};return `<p class="hint">Registra alimentos y suministros. Destacaremos los que venzan en los próximos 7 días.</p><div class="headline"><h2>En casa</h2><span class="counter">${arr.length} productos</span></div>${arr.length?`<div class="list">${arr.map(row).join('')}</div>`:empty('🥑','Despensa vacía','Registra tus alimentos y sus fechas de vencimiento.','add-pantry','Añadir a despensa')}`}
function chores(){const day=new Date().getDay();const todays=data.chores.filter(x=>choreDue(x).due),other=data.chores.filter(x=>!choreDue(x).due);const row=x=>{let info=choreDue(x);let description=`${esc(x.zone)} · ${x.freq==='daily'?'Todos los días':`Cada ${DAYS[Number(x.day)]||'semana'}`}`;return `<div class="item ${info.done?'done':''}"><div class="avatar purple">🧽</div><div class="itembody"><div class="itemtitle">${esc(x.title)}</div><div class="itemmeta">${description}${info.done?' · Hecha hoy':''}</div></div><div class="right">${info.due?btn('toggle-chore',x.id,info.done?'↶':'✓',info.done?'mini light':'mini'):btn('edit-chore',x.id,'Editar','mini light')}${btn('delete-chore',x.id,'×','mini danger')}</div></div>`};return `${header()}<div class="toolbar"><div><div class="eyebrow">Plan semanal</div><h1>Aseo</h1></div><button class="primary" data-action="add-chore">＋ Tarea</button></div><p class="intro">Organiza la limpieza por zona y por día de la semana.</p><div class="taskdate">📅 Hoy es ${DAYS[day].toLowerCase()} · Marca ✓ al terminar una tarea.</div><section class="section"><div class="headline"><h2>Para hoy</h2><span class="counter">${todays.filter(x=>!choreDue(x).done).length} pendientes</span></div>${todays.length?`<div class="list">${todays.map(row).join('')}</div>`:empty('✨','Hoy no hay aseos programados','Registra tareas diarias o semanales para verlas aquí.','add-chore','Crear tarea')}</section>${other.length?`<section class="section"><div class="headline"><h2>Otros días</h2><span class="counter">${other.length} tareas</span></div><div class="list">${other.sort((a,b)=>Number(a.day)-Number(b.day)).map(row).join('')}</div></section>`:''}`}
function payments(){const items=[...data.bills].sort((a,b)=>billsInfo(a).paid-billsInfo(b).paid||billsInfo(a).days-billsInfo(b).days),unpaid=items.filter(x=>!billsInfo(x).paid),total=unpaid.reduce((s,x)=>s+(Number(x.amount)||0),0);return `${header()}<div class="toolbar"><div><div class="eyebrow">Control mensual</div><h1>Servicios</h1></div><button class="primary" data-action="add-bill">＋ Servicio</button></div><p class="intro">Lleva el control de agua, luz, gas, internet y demás pagos de la casa.</p><div class="total">Pendiente este mes: ${money(total)}</div><div class="headline"><h2>Facturas</h2><span class="counter">${unpaid.length} sin pagar</span></div>${items.length?`<div class="list">${items.map(x=>{const s=billsInfo(x);let status=s.paid?'Pagado este mes':s.days<0?`Venció hace ${-s.days} día(s)`:s.days===0?'Vence hoy':`Día ${x.day} · ${s.days} día(s) restante(s)`;return `<div class="item ${s.paid?'done':''}"><div class="avatar rose">🧾</div><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemmeta">${esc(money(x.amount))} · ${esc(status)}</div></div><div class="right">${btn('toggle-bill',x.id,s.paid?'↶':'Pagar',s.paid?'mini light':'mini')}${btn('edit-bill',x.id,'✎','mini light')}${btn('delete-bill',x.id,'×','mini danger')}</div></div>`}).join('')}</div>`:empty('🧾','Sin servicios registrados','Agrega los pagos mensuales para saber cuáles están pendientes.','add-bill','Añadir servicio')}<p class="hint" style="margin-top:15px">Cada servicio se repite mensualmente. “Pagar” marca el mes actual como pagado; no se conecta a ningún banco.</p>`}
function render(){let contents=page==='mercado'?market():page==='aseo'?chores():page==='pagos'?payments():home();$('#app').innerHTML=contents;footer()}
function field(label,type,name,value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,current){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([k,v])=>`<option value="${esc(k)}" ${String(current)===String(k)?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function openForm(kind,id=null,transfer=null){let type=kind.replace(/^add-|^edit-/,'');let coll=({shopping:'shopping',pantry:'pantry',chore:'chores',bill:'bills'})[type];let item=id?data[coll].find(x=>x.id===id):null;const from=transfer?data.shopping.find(x=>x.id===transfer):null;editing={type,id,transfer};let title={shopping:'producto por comprar',pantry:'producto de despensa',chore:'tarea de aseo',bill:'servicio'}[type];let fields='';
if(type==='shopping')fields=field('Producto','text','name',item?.name||'','required maxlength="80" placeholder="Ej. Arroz"')+field('Cantidad','text','qty',item?.qty||'1','maxlength="30" placeholder="Ej. 2 bolsas"');
if(type==='pantry')fields=field('Producto','text','name',item?.name||from?.name||'','required maxlength="80" placeholder="Ej. Leche"')+field('Cantidad','text','qty',item?.qty||from?.qty||'1','maxlength="30" placeholder="Ej. 1 litro"')+field('Fecha de vencimiento (opcional)','date','expires',item?.expires||'')+selectField('Dónde lo guardas','place',[['Despensa','Despensa'],['Nevera','Nevera'],['Congelador','Congelador'],['Baño','Baño'],['Otro','Otro']],item?.place||'Despensa');
if(type==='chore')fields=field('Tarea','text','title',item?.title||'','required maxlength="90" placeholder="Ej. Trapear"')+selectField('Zona',['zone'][0],[['Cocina','Cocina'],['Baño','Baño'],['Habitación','Habitación'],['Sala','Sala'],['Patio','Patio'],['Zona de ropas','Zona de ropas'],['Toda la casa','Toda la casa'],['Otra','Otra']],item?.zone||'Cocina')+selectField('Frecuencia','freq',[['weekly','Una vez por semana'],['daily','Todos los días']],item?.freq||'weekly')+selectField('Día de la semana','day',DAYS.map((d,i)=>[String(i),d]),item?.day??'1')+'<p class="hint">En tareas diarias se mostrará todos los días, sin importar el día seleccionado.</p>';
if(type==='bill')fields=field('Nombre del servicio','text','name',item?.name||'','required maxlength="80" placeholder="Ej. Agua"')+field('Valor en pesos (COP)','number','amount',item?.amount??'','required min="0" step="1" placeholder="Ej. 85000"')+field('Día de vencimiento cada mes','number','day',item?.day??'20','required min="1" max="31" step="1"')+'<p class="hint">Si un mes no tiene ese día, usaremos su último día.</p>';
$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet-head"><h2 id="modalTitle">${id?'Editar':'Añadir'} ${title}</h2><button class="close" type="button" data-action="close" aria-label="Cerrar">×</button></div><form id="entryForm">${fields}<div class="form-actions"><button class="outline" type="button" data-action="close">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form></div></div>`;$('#modalRoot input:not([type=hidden]),#modalRoot select')?.focus()}
function closeModal(){editing=null;$('#modalRoot').innerHTML=''}
function onSubmit(f){if(!editing)return;let form=new FormData(f);let get=k=>String(form.get(k)||'').trim();let type=editing.type;let col={shopping:'shopping',pantry:'pantry',chore:'chores',bill:'bills'}[type];let record={};
if(type==='shopping')record={name:get('name').slice(0,80),qty:get('qty').slice(0,30)||'1',checked:false};
if(type==='pantry')record={name:get('name').slice(0,80),qty:get('qty').slice(0,30)||'1',expires:get('expires'),place:get('place')};
if(type==='chore')record={title:get('title').slice(0,90),zone:get('zone'),freq:get('freq'),day:Number(get('day')),lastDone:''};
if(type==='bill')record={name:get('name').slice(0,80),amount:Math.max(0,Math.round(Number(get('amount'))||0)),day:Math.min(31,Math.max(1,Number(get('day'))||1)),paidMonth:''};
if(!record.name&&!record.title){showToast('Escribe un nombre');return}
if(editing.id){let x=data[col].find(x=>x.id===editing.id);if(!x)return;const oldChecked=x.checked,oldDone=x.lastDone,oldPaid=x.paidMonth;Object.assign(x,record);if(type==='shopping')x.checked=!!oldChecked;if(type==='chore')x.lastDone=oldDone||'';if(type==='bill')x.paidMonth=oldPaid||'';
}else data[col].push({...record,id:uid()});
if(editing.transfer)data.shopping=data.shopping.filter(x=>x.id!==editing.transfer);
save();closeModal();render();showToast('Guardado correctamente')}
function settings(){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="sheet-head"><h2 id="settingsTitle">Ajustes y respaldo</h2><button class="close" type="button" data-action="close" aria-label="Cerrar">×</button></div><div class="notice">Los registros están guardados en este dispositivo y no se sincronizan automáticamente con otros iPhone. Si borras los datos del sitio, podrías perderlos.</div><div class="setting-card"><strong>📥 Exportar mis datos</strong><p>Descarga una copia JSON de compras, despensa, aseo y servicios. Guárdala en Archivos o iCloud Drive.</p><button class="primary full" data-action="export">Descargar copia de seguridad</button></div><div class="setting-card"><strong>📤 Restaurar copia</strong><p>Selecciona un archivo JSON exportado previamente. Reemplazará los datos actuales.</p><button class="outline full" data-action="import">Elegir archivo para restaurar</button></div><p class="hint">Casa en Orden · Versión 1.0 · Sin cuentas, sin pagos bancarios y sin avisos push todavía.</p></div></div>`}
function download(){let blob=new Blob([JSON.stringify({...data,version:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`casa-en-orden-respaldo-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast('Copia lista para guardar')}
async function restore(f){if(!f)return;try{if(f.size>4*1024*1024)throw Error('Archivo demasiado grande');let txt=await f.text(),parsed=JSON.parse(txt);if(!validate(parsed))throw Error('Formato de respaldo inválido');if(!confirm('¿Restaurar esta copia? Se reemplazarán los datos actuales.'))return;data={version:1,shopping:parsed.shopping,pantry:parsed.pantry,chores:parsed.chores,bills:parsed.bills};save();closeModal();render();showToast('Datos restaurados')}catch(e){alert('No se pudo importar: '+e.message)}finally{$('#importFile').value=''}}
const handlers={
'settings':settings,'close':closeModal,'quick-add':()=>openForm('add-shopping'),
'add-shopping':()=>openForm('add-shopping'),'add-pantry':()=>openForm('add-pantry'),
'add-chore':()=>openForm('add-chore'),'add-bill':()=>openForm('add-bill'),
'edit-shopping':id=>openForm('edit-shopping',id),'edit-pantry':id=>openForm('edit-pantry',id),
'edit-chore':id=>openForm('edit-chore',id),'edit-bill':id=>openForm('edit-bill',id),
'delete-shopping':id=>remove('shopping',id),'delete-pantry':id=>remove('pantry',id),
'delete-chore':id=>remove('chores',id),'delete-bill':id=>remove('bills',id),
'export':download,'import':()=>$('#importFile').click(),
'transfer':id=>{marketPage='despensa';openForm('add-pantry',null,id)},
'toggle-chore':id=>{let x=data.chores.find(x=>x.id===id);if(x){x.lastDone=x.lastDone===today()?'':today();save();render()}},
'toggle-bill':id=>{let x=data.bills.find(x=>x.id===id);if(x){x.paidMonth=x.paidMonth===month()?'':month();save();render()}}
};
function remove(col,id){let x=data[col].find(x=>x.id===id);if(!x)return;if(!confirm(`¿Eliminar “${x.name||x.title}”?`))return;data[col]=data[col].filter(x=>x.id!==id);save();render();showToast('Eliminado')}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-nav],[data-market]');if(!btn){if(e.target.id==='overlay')closeModal();return}if(btn.dataset.nav){toPage(btn.dataset.nav);return}if(btn.dataset.market){marketPage=btn.dataset.market;render();return}const action=btn.dataset.action;if(handlers[action])handlers[action](btn.dataset.id)});
document.addEventListener('change',e=>{if(e.target.dataset.check){let x=data.shopping.find(x=>x.id===e.target.dataset.check);if(x){x.checked=e.target.checked;save();render()}}if(e.target.id==='importFile')restore(e.target.files?.[0])});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();onSubmit(e.target)}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
